kind = "web"
previewPath = "/mkp/"
title = "M.K.P — My Kind of Platform"
version = "1.0.0"
id = "artifacts/mkp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mkp/" ]
localPort = 24299

[services.development]
run = "pnpm --filter @workspace/mkp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mkp", "run", "build" ]
publicDir = "artifacts/mkp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24299"
BASE_PATH = "/mkp/"
